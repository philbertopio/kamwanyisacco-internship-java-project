name: Build, Push and Deploy KimwanyiSacco

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: kimwanyi-sacco
  REGISTRY: ghcr.io

jobs:
  mirror-mysql:
    name: Mirror MySQL Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner for image tag
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Pull, retag and push MySQL
        run: |
          docker pull mysql:8.0
          docker tag mysql:8.0 ghcr.io/${{ steps.owner.outputs.owner }}/mysql-mirror:8.0
          docker push ghcr.io/${{ steps.owner.outputs.owner }}/mysql-mirror:8.0

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo owner for image tag
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: [mirror-mysql, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase repo owner for image tag
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "docker-compose.yml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            cat > .env << 'ENVEOF'
            IMAGE_NAME=ghcr.io/${{ steps.owner.outputs.owner }}/${{ env.IMAGE_NAME }}
            MYSQL_IMAGE=ghcr.io/${{ steps.owner.outputs.owner }}/mysql-mirror:8.0
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            PESAPAL_CONSUMER_KEY=${{ secrets.PESAPAL_CONSUMER_KEY }}
            PESAPAL_CONSUMER_SECRET=${{ secrets.PESAPAL_CONSUMER_SECRET }}
            PESAPAL_BASE_URL=${{ secrets.PESAPAL_BASE_URL }}
            PESAPAL_CALLBACK_URL=${{ secrets.PESAPAL_CALLBACK_URL }}
            PESAPAL_IPN_URL=${{ secrets.PESAPAL_IPN_URL }}
            PAYMENT_CURRENCY=${{ secrets.PAYMENT_CURRENCY }}
            BUSINESS_NAME=${{ secrets.BUSINESS_NAME }}
            ENVEOF
            
            # Pull from GHCR under the real repo path
            podman pull ghcr.io/${{ steps.owner.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
            podman pull ghcr.io/${{ steps.owner.outputs.owner }}/mysql-mirror:8.0

            # Retag locally so `podman ps` shows a clean, client-facing name
            podman tag ghcr.io/${{ steps.owner.outputs.owner }}/${{ env.IMAGE_NAME }}:latest kimwanyisacco/app:latest
            podman tag ghcr.io/${{ steps.owner.outputs.owner }}/mysql-mirror:8.0 kimwanyisacco/mysql:8.0

            podman-compose pull
            podman-compose up -d
            podman image prune -f
            echo "✅ Deployment complete"

      - name: Smoke test
        run: |
          sleep 20
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.SERVER_HOST }}:10800/)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 302 ]; then
            echo "✅ Site is live at http://${{ secrets.SERVER_HOST }}:10800"
          else
            echo "❌ Smoke test failed — HTTP $HTTP_STATUS"
            exit 1
          fi