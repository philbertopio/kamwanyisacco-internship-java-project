version: '3.8'

services:
  mysql:
    image: ${MYSQL_IMAGE}
    container_name: kimwanyi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: kimwanyi_sacco
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  app:
    image: ${IMAGE_NAME}:latest
    container_name: kimwanyi-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/kimwanyi_sacco?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      PESAPAL_CONSUMER_KEY: ${PESAPAL_CONSUMER_KEY}
      PESAPAL_CONSUMER_SECRET: ${PESAPAL_CONSUMER_SECRET}
      PESAPAL_BASE_URL: ${PESAPAL_BASE_URL}
      PESAPAL_CALLBACK_URL: ${PESAPAL_CALLBACK_URL}
      PESAPAL_IPN_URL: ${PESAPAL_IPN_URL}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY}
      BUSINESS_NAME: ${BUSINESS_NAME}
    ports:
      - "10080:8080"
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge